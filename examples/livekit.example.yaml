# Standard LiveKit YAML. Replace the keys before exposing publicly.
port: 7880

keys:
  your-livekit-key: your-livekit-secret

rtc:
  tcp_port: 7881            # single UDP media port
  # port_range_start: 50000 # or use a UDP range
  # port_range_end: 60000

room:
  empty_timeout: 300
  departure_timeout: 20

# redis:
#   address: 127.0.0.1:6379   # optional: interop with livekit/sip + livekit/egress
# webhook:
#   api_key: your-livekit-key
#   urls: [https://example.com/livekit/webhook]
# prometheus_port: 6789
